name: device_browser_first
title: Use the logged-in browser first
description: Start logged-in browser work on the user's own device browser where the session already lives, and fall back to the cloud browser only when that device is unreachable.
category: Work and knowledge
include_in_prompt: false
skill_improvement:
  managed: true
  status: active
  measurement:
    proxy_metric_id: objective_success_rate
    success_criterion: In 30 days, sampled tasks that need a login start on the user's own device browser first when it is reachable, a cloud login or session failure is followed by a device attempt instead of another cloud retry, and no sampled report claims the device browser was tried when it was not.
    window_days: 30
  rationale: 'Three logged-in tasks in the 2026-11-13 to 2026-11-14 window failed first in the cloud browser and then succeeded on the user''s own device browser where the session already lived: MyAgeApp after a Telegram Web session expiry, the FAN SZN streak claim after a cloud login error, and Boxcars after a cloud login rate limit. A narrow device-first rule was adopted for bot work and MyAgeApp checks, but later tasks still started in the cloud, so the general routing rule needs a managed skill. A skill search returned no relevant skill. Other candidates were rejected as out of scope, already documented, single-instance, or user-disabled.'
